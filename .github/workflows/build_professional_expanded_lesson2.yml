name: Build Professional Expanded Lesson 2 DOCX

on:
  pull_request:
    branches:
      - lesson2-word-2010
    paths:
      - 'expanded-lesson2/**'

permissions:
  contents: write

jobs:
  build-professional-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install document tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx beautifulsoup4 lxml
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils

      - name: Build professionally formatted Word files
        run: |
          mkdir -p professional-expanded-lesson2 preview-expanded-lesson2
          python expanded-lesson2/build_professional_docx.py \
            expanded-lesson2/lesson2_gold_expanded_student_word2010.doc \
            professional-expanded-lesson2/lesson2_gold_expanded_professional_student_Word2010.docx \
            --title 'أغلى من الذهب ـ تدريبات شاملة'
          python expanded-lesson2/build_professional_docx.py \
            expanded-lesson2/lesson2_gold_expanded_answer_word2010.doc \
            professional-expanded-lesson2/lesson2_gold_expanded_professional_answer_Word2010.docx \
            --title 'نموذج إجابة أغلى من الذهب' --answer

      - name: Create PDF previews
        run: |
          libreoffice --headless --convert-to pdf --outdir preview-expanded-lesson2 professional-expanded-lesson2/lesson2_gold_expanded_professional_student_Word2010.docx
          libreoffice --headless --convert-to pdf --outdir preview-expanded-lesson2 professional-expanded-lesson2/lesson2_gold_expanded_professional_answer_Word2010.docx
          pdftoppm -f 1 -singlefile -png -r 120 preview-expanded-lesson2/lesson2_gold_expanded_professional_student_Word2010.pdf preview-expanded-lesson2/student_page_1
          pdftoppm -f 3 -singlefile -png -r 120 preview-expanded-lesson2/lesson2_gold_expanded_professional_student_Word2010.pdf preview-expanded-lesson2/student_page_3
          pdftoppm -f 4 -singlefile -png -r 120 preview-expanded-lesson2/lesson2_gold_expanded_professional_student_Word2010.pdf preview-expanded-lesson2/student_page_4

      - name: Upload student Word package
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-professional-student-word
          path: professional-expanded-lesson2/lesson2_gold_expanded_professional_student_Word2010.docx

      - name: Upload answer Word package
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-professional-answer-word
          path: professional-expanded-lesson2/lesson2_gold_expanded_professional_answer_Word2010.docx

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-professional-previews
          path: preview-expanded-lesson2

      - name: Commit generated files to branch when possible
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add professional-expanded-lesson2 preview-expanded-lesson2
          if ! git diff --cached --quiet; then
            git commit -m 'Build professionally formatted expanded lesson 2 Word files'
            git pull --rebase origin ${{ github.event.pull_request.head.ref }}
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
