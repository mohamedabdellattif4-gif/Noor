name: Build Final Corrected Lesson 2

on:
  pull_request:
    branches:
      - lesson2-word-2010
    paths:
      - 'final-lesson2/**'
      - '.github/workflows/build-final-lesson2-corrected.yml'

jobs:
  build-final-lesson2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install document tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils

      - name: Validate and build Word files
        run: |
          python -m py_compile final-lesson2/build_final_lesson2.py
          rm -rf final-lesson2/output final-lesson2/preview
          mkdir -p final-lesson2/output final-lesson2/preview
          python final-lesson2/build_final_lesson2.py --outdir final-lesson2/output

      - name: Create previews
        run: |
          libreoffice --headless --convert-to pdf --outdir final-lesson2/preview final-lesson2/output/*.docx
          STUDENT_PDF=$(find final-lesson2/preview -type f -name '*نسخة_الطالب*.pdf' | head -n 1)
          pdftoppm -f 1 -singlefile -png -r 120 "$STUDENT_PDF" final-lesson2/preview/page_1
          pdftoppm -f 3 -singlefile -png -r 120 "$STUDENT_PDF" final-lesson2/preview/page_3
          pdftoppm -f 6 -singlefile -png -r 120 "$STUDENT_PDF" final-lesson2/preview/page_6

      - name: Upload student Word file
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-final-corrected-student-word
          path: final-lesson2/output/*نسخة_الطالب*.docx

      - name: Upload answer Word file
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-final-corrected-answer-word
          path: final-lesson2/output/*نموذج_إجابة*.docx

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-final-corrected-previews
          path: final-lesson2/preview
